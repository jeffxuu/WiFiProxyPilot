name: Windows v3.1 candidate build
on:
  push:
    branches: [feature/ui-tray-performance-v3.1]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wifi-v31-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.425
      - name: Original and new simulated engine tests (Windows PowerShell 5.1)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force release/generated | Out-Null
          powershell.exe -NoProfile -File tests/Run-Tests.ps1 -ResultPath release/generated/engine-results-windows.json
          if ($LASTEXITCODE) { throw 'Engine regression failed' }
          $r=Get-Content release/generated/engine-results-windows.json -Raw | ConvertFrom-Json
          if ($r.Total -lt 113 -or $r.Failed) { throw 'Engine test contract failed' }
      - name: Self-contained EXE and original plus new C# tests
        shell: powershell
        run: ./release/Build.ps1
      - name: Isolated WinForms, tray, editor and synthetic DPI smoke
        shell: pwsh
        run: |
          $dir=Join-Path $env:RUNNER_TEMP 'WiFi 中文 smoke path'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item release/dist/WiFiProxySwitcher.exe (Join-Path $dir 'WiFiProxySwitcher.exe')
          $report=Join-Path (Get-Location) 'release/generated/desktop/exe-smoke-windows.json'
          $p=Start-Process -FilePath (Join-Path $dir 'WiFiProxySwitcher.exe') -ArgumentList @('/self-test','/output',('"'+$report+'"')) -WindowStyle Hidden -PassThru -Wait
          if ($p.ExitCode) { throw 'Desktop smoke failed' }
          $r=Get-Content $report -Raw | ConvertFrom-Json
          if ($r.Failed -or $r.ProxyWritten -or $r.TaskWritten) { throw 'Isolation contract failed' }
      - name: Upload distributables and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WiFiProxySwitcher-v3.1.0-${{ github.sha }}
          path: |
            release/generated/*results*.json
            release/generated/desktop/*.json
            release/generated/desktop/*.png
            release/dist/*
          retention-days: 30
      - name: Prepare v3.1.0 draft prerelease only
        if: success() && github.ref == 'refs/heads/feature/ui-tray-performance-v3.1'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v3.1.0 --json isDraft 2>$null | Out-File release/generated/existing-draft.json -Encoding utf8
          if ($LASTEXITCODE -eq 0) {
            $r=Get-Content release/generated/existing-draft.json -Raw | ConvertFrom-Json
            if (-not $r.isDraft) { throw 'v3.1.0 is already published; refusing replacement' }
            gh release edit v3.1.0 --target $env:GITHUB_SHA --title 'v3.1.0 · 待真实 Windows 网络验收' --notes-file release/NOTES-v3.1.0.md --draft --prerelease
            if ($LASTEXITCODE) { throw 'Draft update failed' }
            gh release upload v3.1.0 release/dist/WiFiProxySwitcher.exe release/dist/WiFiProxySwitcher.zip release/dist/SHA256.txt --clobber
          } else {
            gh release create v3.1.0 release/dist/WiFiProxySwitcher.exe release/dist/WiFiProxySwitcher.zip release/dist/SHA256.txt --target $env:GITHUB_SHA --draft --prerelease --title 'v3.1.0 · 待真实 Windows 网络验收' --notes-file release/NOTES-v3.1.0.md
          }
          if ($LASTEXITCODE) { throw 'Draft preparation failed' }
